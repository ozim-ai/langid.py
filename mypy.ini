[mypy]
strict = True
show_error_codes = True
python_version = 3.9
ignore_missing_imports = True
files = langid/langid.py

# Per-module options
[mypy-langid.langid]
# Allow untyped imports for numpy and other scientific libraries
ignore_missing_imports = True
ignore_errors = True

# Allow certain untyped functions that are part of the external API
disallow_untyped_defs = False

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-bz2.*]
ignore_missing_imports = True

[mypy-base64.*]
ignore_missing_imports = True

[mypy-pickle.*]
ignore_missing_imports = True

[mypy-logging.*]
ignore_missing_imports = True

[mypy-argparse.*]
ignore_missing_imports = True

[mypy-sys.*]
ignore_missing_imports = True

[mypy-os.*]
ignore_missing_imports = True

[mypy-json.*]
ignore_missing_imports = True

[mypy-urlparse.*]
ignore_missing_imports = True

[mypy-cPickle.*]
ignore_missing_imports = True

[mypy-urllib2.*]
ignore_missing_imports = True

[mypy-fapws.*]
ignore_missing_imports = True
