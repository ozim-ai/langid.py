[mypy]
# Enable strict type checking
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_untyped_decorators = False
no_implicit_optional = False
warn_redundant_casts = False
warn_unused_ignores = False
warn_return_any = False
warn_unreachable = False
strict_equality = False

# Show error codes
show_error_codes = True

# Python version
python_version = 3.9

# Ignore missing imports for external libraries
ignore_missing_imports = True

# Files to check
files = langid/langid.py



# Exclude certain directories/files if needed
exclude = 
    langid/train/
    langid/tools/
    langid/examples/

# Per-module options
[mypy-langid.langid]
# Allow untyped imports for numpy and other scientific libraries
ignore_missing_imports = True
ignore_errors = True

# Allow certain untyped functions that are part of the external API
disallow_untyped_defs = False

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-bz2.*]
ignore_missing_imports = True

[mypy-base64.*]
ignore_missing_imports = True

[mypy-pickle.*]
ignore_missing_imports = True

[mypy-logging.*]
ignore_missing_imports = True

[mypy-argparse.*]
ignore_missing_imports = True

[mypy-sys.*]
ignore_missing_imports = True

[mypy-os.*]
ignore_missing_imports = True

[mypy-json.*]
ignore_missing_imports = True

[mypy-urlparse.*]
ignore_missing_imports = True

[mypy-cPickle.*]
ignore_missing_imports = True

[mypy-urllib2.*]
ignore_missing_imports = True

[mypy-fapws.*]
ignore_missing_imports = True
